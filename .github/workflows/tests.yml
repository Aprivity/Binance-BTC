name: Test BTC strategy-neutral framework
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Offline inert smoke test
        run: python -m btc_quant demo

  candlestick_research:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/btc-candlestick-baselines-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-range project dependencies
        run: python -m pip install -r requirements.txt
      - name: Real BTC spot candlestick event study
        run: python -m experiments.candlestick_study
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-candlestick-study
          path: outputs/candlestick-research/
          if-no-files-found: warn
